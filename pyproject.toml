[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "motion-tracker"
version = "0.1.0"
description = "Cross-platform still-image capture GUI with ORB+homography motion tracking"
requires-python = ">=3.10"
dependencies = [
    "opencv-python==4.10.0.84",
    "Pillow==10.4.0",
    "numpy>=1.24.0,<2.0.0",
    "pyserial==3.5",
]

[project.scripts]
motion-tracker = "motion_tracker.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
